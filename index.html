<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a0a14">
<meta name="description" content="S TV — Бесплатное ТВ и Радио online">
<title>S TV — ТВ и Радио</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230a0a14'/><text x='50' y='72' text-anchor='middle' font-size='60' font-weight='bold' fill='%2300d4ff'>S</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a14;--bg2:#0f0f1a;--card:rgba(255,255,255,0.03);--border:rgba(255,255,255,0.06);--accent:#00d4ff;--radio:#ff5e94;--hd:#00e676;--sd:#ffd600;--fhd:#00e5ff;--text:#fff;--text2:#989899;--text3:#5a5a6e;--r:16px}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:3px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit;border:none;outline:none}

/* SPLASH */
#splash{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .6s}
#splash.out{opacity:0;pointer-events:none}
#splashCanvas{position:absolute;inset:0;width:100%;height:100%}
.sp-body{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:12px}
.sp-logo{font-size:72px;font-weight:700;color:var(--accent);text-shadow:0 0 40px rgba(0,212,255,0.5),0 0 80px rgba(0,212,255,0.2);animation:pop .8s cubic-bezier(.34,1.56,.64,1) forwards;transform:scale(0)}
@keyframes pop{to{transform:scale(1)}}
.sp-slogan{font-size:15px;color:var(--text2);font-weight:300;min-height:22px}
.sp-slogan .cur{display:inline-block;width:2px;height:16px;background:var(--accent);vertical-align:text-bottom;animation:blink .6s step-end infinite}
@keyframes blink{50%{opacity:0}}
.sp-dev{position:absolute;bottom:50px;font-size:12px;color:var(--text3);opacity:0;animation:fi .5s .5s forwards}
@keyframes fi{to{opacity:1}}
.sp-bar{position:absolute;bottom:30px;width:200px;height:2px;background:rgba(255,255,255,0.05);border-radius:1px;overflow:hidden}
.sp-fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),#7B2FFF);transition:width .1s linear}

/* HEADER */
.hdr{position:sticky;top:0;z-index:100;background:rgba(10,10,20,0.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:10px}
.hdr-logo{font-size:20px;font-weight:700;color:var(--accent);white-space:nowrap}
.hdr-search{flex:1;max-width:360px;position:relative}
.hdr-search input{width:100%;padding:9px 34px 9px 36px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;color:#fff;font-size:13px;transition:border .3s}
.hdr-search input:focus{border-color:var(--accent)}
.hdr-search input::placeholder{color:var(--text3)}
.hdr-search i{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:13px}
.hdr-x{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;display:none;align-items:center;justify-content:center;color:var(--text3);font-size:11px}
.hdr-x.on{display:flex}.hdr-x:hover{background:rgba(255,255,255,0.08)}
.hdr-stats{font-size:11px;color:var(--text3);white-space:nowrap}.hdr-stats b{color:var(--accent)}
.hdr-btn{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:15px;transition:.3s}
.hdr-btn:hover{background:rgba(255,255,255,0.06);color:var(--accent)}
.hdr-btn.spin i{animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* TABS — desktop only */
.tabs{display:none;padding:12px 16px 0;gap:4px}
.tab{flex:1;padding:10px;border-radius:12px;font-size:13px;font-weight:600;text-align:center;background:var(--card);border:1px solid var(--border);transition:.3s}
.tab:hover{border-color:rgba(0,212,255,0.3)}
.tab.on{background:var(--accent);color:#000;border-color:var(--accent)}

/* SCAN */
.scan-w{height:3px;background:var(--bg2);margin:0 16px;border-radius:2px;overflow:hidden;display:none}
.scan-w.on{display:block}
.scan-i{height:100%;width:0;background:linear-gradient(90deg,var(--accent),#7B2FFF);transition:width .15s}
.scan-t{padding:6px 16px;font-size:11px;color:var(--text3);text-align:center;display:none}
.scan-t.on{display:block}

/* CATEGORIES */
.cats{display:flex;gap:6px;padding:10px 16px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.cats::-webkit-scrollbar{display:none}
.cat{padding:7px 14px;border-radius:18px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--card);border:1px solid var(--border);color:var(--text2);transition:.3s;flex-shrink:0}
.cat:hover,.cat.on{background:var(--accent);color:#000;border-color:var(--accent)}

/* GRID */
.main{padding:8px 16px 80px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}

/* CARD */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;transition:.35s cubic-bezier(.34,1.56,.64,1);cursor:pointer}
.card:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 8px 30px rgba(0,212,255,0.12)}
.card-th{aspect-ratio:16/9;background:var(--bg2);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.card-th::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.04),transparent);animation:shim 2s infinite}
@keyframes shim{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.card-th img{width:100%;height:100%;object-fit:contain;position:relative;z-index:1}
.card-q{position:absolute;top:6px;left:6px;padding:2px 7px;border-radius:6px;font-size:9px;font-weight:700;text-transform:uppercase;z-index:2}
.card-q.hd{background:rgba(0,230,118,0.15);color:var(--hd)}
.card-q.sd{background:rgba(255,214,0,0.15);color:var(--sd)}
.card-q.fhd{background:rgba(0,229,255,0.15);color:var(--fhd)}
.card-star{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text3);transition:.3s;z-index:2}
.card-star.on{color:#ffd600}
.card-body{padding:10px 12px}
.card-name{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
.card-name mark{background:rgba(0,212,255,0.3);color:#fff;border-radius:2px;padding:0 2px}
.card-cat{font-size:10px;color:var(--text3);margin-bottom:6px}
.card-btn{width:100%;padding:7px;border-radius:8px;font-size:11px;font-weight:600;background:rgba(0,212,255,0.1);color:var(--accent);transition:.3s}
.card-btn:hover{background:var(--accent);color:#000}

/* RADIO CARD */
.card.rc{border-color:rgba(255,94,148,0.12)}
.card.rc:hover{border-color:var(--radio);box-shadow:0 8px 30px rgba(255,94,148,0.12)}
.card.rc .card-th{background:linear-gradient(135deg,rgba(255,94,148,0.08),rgba(123,47,255,0.08))}
.card.rc .card-btn{background:rgba(255,94,148,0.1);color:var(--radio)}
.card.rc .card-btn:hover{background:var(--radio);color:#fff}
.eq{display:flex;gap:3px;align-items:flex-end;height:28px}
.eq i{display:block;width:3px;border-radius:2px;background:var(--radio);transition:height .15s}
.eq i:nth-child(1){height:6px;animation:eq .7s ease-in-out infinite alternate}
.eq i:nth-child(2){height:14px;animation:eq .7s .1s ease-in-out infinite alternate}
.eq i:nth-child(3){height:10px;animation:eq .7s .2s ease-in-out infinite alternate}
.eq i:nth-child(4){height:18px;animation:eq .7s .05s ease-in-out infinite alternate}
.eq i:nth-child(5){height:8px;animation:eq .7s .15s ease-in-out infinite alternate}
@keyframes eq{to{height:4px}}
.card.rc:not(.playing) .eq i{animation-play-state:paused;height:4px}
.card.rc.playing .eq i{animation-play-state:running}
.card.rc:hover .eq i{animation-play-state:running}

/* VIDEO PLAYER — NEW MODERN DESIGN */
.vid-ov{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,0.95);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:.4s}
.vid-ov.on{opacity:1;pointer-events:auto}
.vid-box{width:100%;max-width:600px;background:linear-gradient(180deg,#14141a 0%,#0a0a14 100%);border-radius:24px;overflow:hidden;transform:translateY(40px) scale(0.95);transition:transform .5s cubic-bezier(.34,1.56,.64,1);position:relative;margin:16px}
.vid-ov.on .vid-box{transform:translateY(0) scale(1)}
.vid-top{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 12px}
.vid-title{font-size:16px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vid-close{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:14px;transition:.3s;flex-shrink:0}
.vid-close:hover{background:var(--radio);color:#fff}
.vid-screen{position:relative;background:#000;margin:0 16px;border-radius:16px;overflow:hidden;aspect-ratio:16/9}
.vid-screen video{width:100%;height:100%;display:block}
.vid-screen .vid-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.5)}
.vid-screen .vid-loading .spinner{width:40px;height:40px;border:3px solid rgba(255,255,255,0.1);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.vid-controls{padding:16px 20px 20px}
.vid-progress{width:100%;height:4px;background:rgba(255,255,255,0.1);border-radius:2px;cursor:pointer;margin-bottom:14px;position:relative}
.vid-progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),#0072ff);border-radius:2px;width:0;transition:width .1s;position:relative}
.vid-progress-fill::after{content:'';position:absolute;right:-6px;top:50%;transform:translateY(-50%);width:12px;height:12px;border-radius:50%;background:var(--accent);opacity:0;transition:opacity .2s;box-shadow:0 0 8px rgba(0,212,255,0.5)}
.vid-progress:hover .vid-progress-fill::after{opacity:1}
.vid-btns{display:flex;align-items:center;gap:6px}
.vid-btn{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:18px;transition:.3s;background:rgba(255,255,255,0.05)}
.vid-btn:hover{background:rgba(255,255,255,0.1);color:#fff}
.vid-btn.play{width:56px;height:56px;border-radius:50%;background:var(--accent);color:#000;font-size:22px;box-shadow:0 4px 20px rgba(0,212,255,0.4)}
.vid-btn.play:hover{transform:scale(1.08);box-shadow:0 6px 28px rgba(0,212,255,0.5)}
.vid-btn.play i{margin-left:2px}
.vid-time{font-size:12px;color:var(--text3);margin-left:auto;margin-right:4px}
.vid-vol{display:flex;align-items:center;gap:4px}
.vid-vol input{width:60px;accent-color:var(--accent);height:4px}
.vid-live{position:absolute;top:12px;left:12px;padding:3px 10px;border-radius:6px;font-size:10px;font-weight:700;background:rgba(255,50,50,0.9);color:#fff;letter-spacing:1px}

/* AUDIO PLAYER */
.aud-bar{position:fixed;bottom:60px;left:0;right:0;z-index:90;background:rgba(10,10,20,0.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid rgba(255,94,148,0.15);padding:10px 14px;display:none;align-items:center;gap:10px}
.aud-bar.on{display:flex}
.aud-eq{display:flex;gap:2px;align-items:flex-end;height:22px;min-width:22px}
.aud-eq i{display:block;width:3px;border-radius:2px;background:var(--radio)}
.aud-info{flex:1;min-width:0}
.aud-info .aud-n{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aud-info .aud-s{font-size:10px;color:var(--radio)}
.aud-play{width:36px;height:36px;border-radius:50%;background:var(--radio);display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;transition:.2s}
.aud-play:hover{transform:scale(1.08)}
.aud-close{color:var(--text3);font-size:16px;padding:4px}

/* SETTINGS */
.sett{display:none;padding:20px 16px 80px}
.sett.on{display:block}
.sett-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:20px}
.sett h2{font-size:20px;font-weight:700;margin-bottom:20px}
.sett-grp{margin-bottom:18px}
.sett-grp h3{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.sett-row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--bg2);border-radius:10px;margin-bottom:6px}
.sett-row label{font-size:13px}
.sett-sel{padding:7px 10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:#fff;font-size:12px}
.sett-btn{width:100%;padding:12px;border-radius:10px;font-size:13px;font-weight:500;text-align:center;transition:.3s;margin-bottom:6px}
.sett-btn.primary{background:var(--accent);color:#000}
.sett-btn.danger{background:rgba(255,94,148,0.1);color:var(--radio);border:1px solid rgba(255,94,148,0.2)}
.sett-btn.danger:hover{background:rgba(255,94,148,0.2)}
.sett-dev{text-align:center;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
.sett-dev p{font-size:12px;color:var(--text3);margin-bottom:4px}
.sett-dev a{color:var(--accent);font-size:13px}

/* TOAST */
.toast-c{position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:6px}
.toast{padding:10px 18px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;font-size:12px;color:#fff;transform:translateX(120%);transition:transform .4s cubic-bezier(.34,1.56,.64,1);box-shadow:0 6px 24px rgba(0,0,0,0.5)}
.toast.on{transform:translateX(0)}

/* SCROLL TOP */
.to-top{position:fixed;bottom:70px;right:14px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#000;display:none;align-items:center;justify-content:center;font-size:16px;z-index:80;box-shadow:0 4px 16px rgba(0,212,255,0.3)}
.to-top.on{display:flex}

/* EMPTY */
.empty{text-align:center;padding:50px 16px;color:var(--text3)}
.empty i{font-size:40px;margin-bottom:12px;opacity:.3}
.empty p{font-size:13px}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:99;background:rgba(10,10,20,0.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);display:none;align-items:center;padding:4px 0 env(safe-area-inset-bottom,4px)}
.bottom-nav.on{display:flex}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0;color:var(--text3);font-size:9px;transition:color .3s;cursor:pointer}
.nav-item.on{color:var(--accent)}
.nav-item i{font-size:18px}

/* SIDEBAR — desktop only */
.sidebar{display:none!important}
@media(min-width:768px){
.tabs{display:flex!important}
.bottom-nav{display:none!important}
.sidebar{position:fixed!important;left:0;top:0;bottom:0;width:240px;background:var(--bg2);border-right:1px solid var(--border);z-index:90;padding:20px 0;display:none;flex-direction:column!important}
.sidebar.on{display:flex!important}
.sidebar-logo{font-size:20px;font-weight:700;color:var(--accent);padding:0 20px 20px}
.sidebar-nav{flex:1}
.sidebar-item{display:flex;align-items:center;gap:12px;padding:12px 20px;color:var(--text2);font-size:14px;transition:.3s;cursor:pointer}
.sidebar-item:hover{color:#fff;background:rgba(255,255,255,0.03)}
.sidebar-item.on{color:var(--accent);background:rgba(0,212,255,0.05)}
.sidebar-item i{width:20px;text-align:center;font-size:18px}
.sidebar-dev{padding:16px 20px;font-size:11px;color:var(--text3);border-top:1px solid var(--border)}
.hdr{padding-left:260px}
.main,.sett{padding-left:260px}
.cats{padding-left:260px}
.aud-bar{left:260px}
.vid-box{max-width:900px}
}

/* RESPONSIVE */
@media(min-width:500px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1024px){.grid{grid-template-columns:repeat(5,1fr)}}
@media(min-width:1440px){.grid{grid-template-columns:repeat(6,1fr);max-width:1500px;margin:0 auto}}
</style>
</head>
<body>

<div id="splash">
<canvas id="splashCanvas"></canvas>
<div class="sp-body">
<div class="sp-logo">S TV</div>
<div class="sp-slogan" id="slogan"></div>
<div class="sp-dev">by Safarali Group 🛡</div>
</div>
<div class="sp-bar"><div class="sp-fill" id="sFill"></div></div>
</div>

<header class="hdr">
<div class="hdr-logo">S TV</div>
<div class="hdr-search">
<i class="fas fa-search"></i>
<input id="searchIn" placeholder="Поиск каналов..." autocomplete="off">
<button class="hdr-x" id="searchX"><i class="fas fa-times"></i></button>
</div>
<div class="hdr-stats">ТВ: <b id="cntTv">0</b> | Радио: <b id="cntR">0</b></div>
<button class="hdr-btn" id="randBtn" title="Случайный"><i class="fas fa-dice"></i></button>
<button class="hdr-btn" id="refBtn" title="Обновить"><i class="fas fa-sync-alt"></i></button>
</header>

<nav class="sidebar" id="sidebar">
<div class="sidebar-logo">S TV</div>
<div class="sidebar-nav">
<div class="sidebar-item on" data-tab="tv"><i class="fas fa-tv"></i> ТВ Каналы</div>
<div class="sidebar-item" data-tab="radio"><i class="fas fa-radio"></i> Радио</div>
<div class="sidebar-item" data-tab="fav"><i class="fas fa-star"></i> Избранное</div>
<div class="sidebar-item" data-tab="settings"><i class="fas fa-cog"></i> Настройки</div>
</div>
<div class="sidebar-dev">by Safarali Group 🛡 v1.0.0</div>
</nav>

<div class="scan-w" id="scanW"><div class="scan-i" id="scanI"></div></div>
<div class="scan-t" id="scanT"></div>

<div class="tabs">
<button class="tab on" data-t="tv">📺 ТВ Каналы</button>
<button class="tab" data-t="radio">📻 Радио</button>
<button class="tab" data-t="fav">⭐ Избранное</button>
<button class="tab" data-t="settings">⚙️ Настройки</button>
</div>

<div class="cats" id="catsW"></div>

<main class="main" id="mainW">
<div class="grid" id="grid"></div>
<div class="empty" id="empty" style="display:none"><i class="fas fa-satellite-dish"></i><p>Каналы не найдены</p></div>
</main>

<div class="sett" id="settW">
<div class="sett-card">
<h2>⚙️ Настройки</h2>
<div class="sett-grp">
<h3>Внешний вид</h3>
<div class="sett-row"><label>Тема</label><select class="sett-sel" id="themeSel"><option value="dark">Тёмная</option><option value="amoled">AMOLED</option><option value="gray">Серая</option></select></div>
<div class="sett-row"><label>Размер сетки</label><select class="sett-sel" id="gridSel"><option value="2">Компактный</option><option value="3" selected>Стандартный</option><option value="4">Крупный</option></select></div>
</div>
<div class="sett-grp">
<h3>Данные</h3>
<button class="sett-btn primary" id="refreshBtn">🔄 Обновить каналы</button>
<button class="sett-btn danger" id="clearCacheBtn">🗑 Очистить кеш</button>
</div>
<div class="sett-grp">
<h3>О приложении</h3>
<div class="sett-row"><label>Версия</label><span style="color:var(--text2);font-size:12px">1.0.0</span></div>
<div class="sett-row"><label>Разработчик</label><span style="color:var(--text2);font-size:12px">Safarali Group 🛡</span></div>
<div class="sett-row"><label>Каналов</label><span style="color:var(--accent);font-size:12px" id="settCount">0</span></div>
</div>
<div class="sett-dev">
<a href="https://t.me/Mushtariy_LLC" target="_blank"><i class="fab fa-telegram"></i> Telegram @Mushtariy_LLC</a>

<button class="nav-item" data-tab="fav"><i class="fas fa-star"></i><span>Избранное</span></button>
<button class="nav-item" data-tab="settings"><i class="fas fa-cog"></i><span>Ещё</span></button>
</nav>

<audio id="audEl" crossorigin="anonymous"></audio>

<script>
(function(){
'use strict';

var _ch=[],_tvIdx=[],_radIdx=[],_favIdx=[];
var _tab='tv',_cat='all',_q='',_scanning=false,_curIdx=-1;
var _hls=null,_audioCtx=null,_animF=null;
var _theme=localStorage.getItem('stv_theme')||'dark';
var _gridCols=parseInt(localStorage.getItem('stv_grid')||'3');

var API_S='https://iptv-org.github.io/api/streams.json';
var API_C='https://iptv-org.github.io/api/channels.json';

var $=function(s){return document.querySelector(s)};
var $$=function(s){return document.querySelectorAll(s)};

var CAT_LABELS={'news':'Новости','movies':'Фильмы','sports':'Спорт','kids':'Дети','music':'Музыка','education':'Образование','general':'Общее','religious':'Религия','regional':'Регионы','entertainment':'Развлечения','comedy':'Комедии','documentary':'Документальные','weather':'Погода','food':'Еда','outdoor':'На природе','travel':'Путешествия','shopping':'Покупки'};
var CAT_MAP={'entertainment':'general','comedy':'general','documentary':'general','weather':'news','food':'general','outdoor':'general','travel':'general','shopping':'general'};
var TV_C=['all','news','movies','sports','kids','music','general','regional'];
var TV_L=['🔥 Все','📰 Новости','🎬 Фильмы','⚽ Спорт','👶 Дети','🎵 Музыка','📺 Общее','🌍 Регионы'];
var R_C=['all','music','regional'];
var R_L=['🔥 Все','🎵 Музыка','🌐 Регионы'];

// ===== SPLASH =====
!function(){
var cv=$('#splashCanvas'),cx=cv.getContext('2d'),stars=[],mx=0,my=0;
function rs(){cv.width=innerWidth;cv.height=innerHeight}
rs();addEventListener('resize',rs);
for(var i=0;i<180;i++)stars.push({x:Math.random()*cv.width,y:Math.random()*cv.height,r:Math.random()*1.4+.3,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25,a:Math.random()});
addEventListener('mousemove',function(e){mx=(e.clientX/cv.width-.5)*15;my=(e.clientY/cv.height-.5)*15});
function draw(){cx.clearRect(0,0,cv.width,cv.height);for(var i=0;i<stars.length;i++){var s=stars[i];s.x+=s.vx;s.y+=s.vy;if(s.x<0)s.x=cv.width;if(s.x>cv.width)s.x=0;if(s.y<0)s.y=cv.height;if(s.y>cv.height)s.y=0;cx.beginPath();cx.arc(s.x+mx*s.a,s.y+my*s.a,s.r,0,6.28);cx.fillStyle='rgba(255,255,255,'+(0.25+s.a*0.5)+')';cx.fill()}requestAnimationFrame(draw)}
draw();
var sl='ТВ и Радио — всегда под рукой',el=$('#slogan'),si=0;
function tc(){if(si<sl.length){el.innerHTML=sl.slice(0,si+1)+'<span class="cur"></span>';si++;setTimeout(tc,55)}else el.innerHTML=sl+'<span class="cur"></span>'}
setTimeout(tc,900);
var p=0,fl=$('#sFill');
var iv=setInterval(function(){p+=Math.random()*12+3;if(p>=100){p=100;clearInterval(iv);setTimeout(function(){$('#splash').classList.add('out');setTimeout(function(){$('#splash').remove();init()},600)},250)}fl.style.width=p+'%'},100);
}();

// ===== INIT =====
function init(){
loadFav();
applyTheme();applyGrid();
if(window.innerWidth>=768){$('#sidebar').classList.add('on')}
else{$('#bottomNav').classList.add('on')}
var cached=localStorage.getItem('stv_c');
var ct=parseInt(localStorage.getItem('stv_ct')||'0');
if(cached&&Date.now()-ct<864e5){
try{var p=JSON.parse(cached);_ch=[];for(var i=0;i<p.length;i++){_ch.push({name:p[i].name,url:p[i].url||'',logo:p[i].logo||'',cat:p[i].cat||[],q:p[i].q||'',t:p[i].t||'tv'})}}catch(e){_ch=[]}
buildIdx();render();renderCats();
}else{doScan()}
setupEvents();
}

function buildIdx(){
_tvIdx=[];_radIdx=[];
for(var i=0;i<_ch.length;i++){if(_ch[i].t==='tv')_tvIdx.push(i);else _radIdx.push(i)}
$('#cntTv').textContent=_tvIdx.length;
$('#cntR').textContent=_radIdx.length;
var sc=$('#settCount');if(sc)sc.textContent=_ch.length;
}

// ===== THEME & GRID =====
function applyTheme(){
var r=document.documentElement;
if(_theme==='amoled'){r.style.setProperty('--bg','#000');r.style.setProperty('--bg2','#050508')}
else if(_theme==='gray'){r.style.setProperty('--bg','#121218');r.style.setProperty('--bg2','#1a1a24')}
else{r.style.setProperty('--bg','#0a0a14');r.style.setProperty('--bg2','#0f0f1a')}
}
function applyGrid(){
var g=$('#grid');if(g)g.style.gridTemplateColumns='repeat('+_gridCols+',1fr)';
}

function matchC(ch,c){
if(c==='all')return true;
var cats=ch.cat||[];var target=CAT_MAP[c]||c;
for(var i=0;i<cats.length;i++){if(cats[i]===target)return true}
return false;
}

function renderCats(){
if(_tab==='fav'||_tab==='settings'){$('#catsW').style.display='none';return}
$('#catsW').style.display='';
var cs=_tab==='radio'?R_C:TV_C;var ls=_tab==='radio'?R_L:TV_L;var h='';
for(var i=0;i<cs.length;i++){h+='<button class="cat'+(cs[i]===_cat?' on':'')+'" data-c="'+cs[i]+'">'+ls[i]+'</button>'}
$('#catsW').innerHTML=h;
}

function hl(t){
if(!_q)return t;
var re=new RegExp('('+_q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
return t.replace(re,'<mark>$1</mark>');
}

function getFiltered(){
var idxs=_tab==='radio'?_radIdx:_tvIdx;var result=[];
for(var i=0;i<idxs.length;i++){var ch=_ch[idxs[i]];if(_q&&ch.name.toLowerCase().indexOf(_q.toLowerCase())<0)continue;if(!matchC(ch,_cat))continue;result.push(idxs[i])}
return result;
}

function render(){
var g=$('#grid'),em=$('#empty');
if(_tab==='settings'){$('#mainW').style.display='none';$('#settW').classList.add('on');$('#catsW').style.display='none';return}
$('#mainW').style.display='';$('#settW').classList.remove('on');
var filtered;
if(_tab==='fav'){$('#catsW').style.display='none';filtered=[];for(var i=0;i<_favIdx.length;i++){if(_favIdx[i]<_ch.length)filtered.push(_favIdx[i])}if(!filtered.length){g.innerHTML='';em.style.display='';em.querySelector('p').textContent='Нет избранных каналов';return}}
else{$('#catsW').style.display='';filtered=getFiltered();if(!filtered.length){g.innerHTML='';em.style.display='';em.querySelector('p').textContent='Каналы не найдены';return}}
em.style.display='none';g.innerHTML=filtered.map(function(idx){return makeCard(idx)}).join('');
}

function makeCard(idx){
var ch=_ch[idx],isFav=_favIdx.indexOf(idx)>=0,isR=ch.t==='r';
var qc=ch.q?'<span class="card-q '+ch.q+'">'+ch.q.toUpperCase()+'</span>':'';
var logoHtml=ch.logo?'<img src="'+ch.logo+'" alt="" loading="lazy" onerror="this.style.display=\'none\'">':'';
if(isR||!ch.logo)logoHtml='<div class="eq"><i></i><i></i><i></i><i></i><i></i></div>';
var catLabel=ch.cat&&ch.cat[0]?(CAT_LABELS[ch.cat[0]]||ch.cat[0]):'';
return'<div class="card'+(isR?' rc':'')+'" data-i="'+idx+'"><div class="card-th">'+qc+logoHtml+'<span class="card-star'+(isFav?' on':'')+'" data-f="'+idx+'"><i class="'+(isFav?'fas':'far')+' fa-star"></i></span></div><div class="card-body"><div class="card-name">'+hl(ch.name)+'</div>'+(catLabel?'<div class="card-cat">'+catLabel+'</div>':'')+'<button class="card-btn" data-p="'+idx+'">'+(isR?'▶ Слушать':'▶ Смотреть')+'</button></div></div>';
}

// ===== SCANNER =====
function doScan(){
if(_scanning)return;_scanning=true;
$('#scanW').classList.add('on');$('#scanT').classList.add('on');$('#refBtn').classList.add('spin');
$('#scanT').textContent='Загрузка каналов...';$('#scanI').style.width='10%';
Promise.all([fetch(API_C).then(function(r){return r.json()}),fetch(API_S).then(function(r){return r.json()})]).then(function(data){
var channels=data[0],streams=data[1];
$('#scanI').style.width='50%';$('#scanT').textContent='Обработка '+channels.length+' каналов...';
var sm={};for(var i=0;i<streams.length;i++){var s=streams[i];if(s.channel&&s.url&&!sm[s.channel])sm[s.channel]={url:s.url,quality:s.quality||''}}
_ch=[];var rk=['radio','fm'];
for(var i=0;i<channels.length;i++){var ch=channels[i],st=sm[ch.id];if(!st)continue;
var name=ch.name||ch.id,isRadio=false,nl=name.toLowerCase();
for(var j=0;j<rk.length;j++){if(nl.indexOf(rk[j])>=0){isRadio=true;break}}
if(!isRadio&&ch.categories){for(var j=0;j<ch.categories.length;j++){if(ch.categories[j]==='radio'){isRadio=true;break}}}
var q='';var ql=(st.quality||'').toLowerCase();
if(ql.indexOf('1080')>=0||ql.indexOf('fhd')>=0)q='fhd';else if(ql.indexOf('720')>=0||ql.indexOf('hd')>=0)q='hd';else if(ql.indexOf('480')>=0||ql.indexOf('sd')>=0)q='sd';
var logo=ch.id?'https://iptv-org.github.io/api/logo/'+encodeURIComponent(ch.id)+'.png':'';
_ch.push({name:name,url:st.url,logo:logo,cat:ch.categories||[],q:q,t:isRadio?'r':'tv'})}
buildIdx();render();renderCats();
var cacheData=_ch.map(function(c){return{name:c.name,url:c.url,logo:c.logo,cat:c.cat,q:c.q,t:c.t}});
localStorage.setItem('stv_c',JSON.stringify(cacheData));localStorage.setItem('stv_ct',Date.now().toString());
$('#scanW').classList.remove('on');$('#scanT').classList.remove('on');$('#refBtn').classList.remove('spin');
$('#scanT').textContent='Готово! ТВ: '+_tvIdx.length+' | Радио: '+_radIdx.length;_scanning=false;
}).catch(function(err){$('#scanT').textContent='Ошибка: '+err.message;$('#scanW').classList.remove('on');$('#refBtn').classList.remove('spin');_scanning=false});
}

function refreshScan(){localStorage.removeItem('stv_c');localStorage.removeItem('stv_ct');_ch=[];buildIdx();render();doScan();setTab('tv');toast('🔄 Каналы обновляются...')}
function clearCache(){localStorage.removeItem('stv_c');localStorage.removeItem('stv_ct');_ch=[];_tvIdx=[];_radIdx=[];render();toast('🗑 Кеш очищен');doScan()}

// ===== VIDEO PLAYER =====
function openVid(idx){
if(idx<0||idx>=_ch.length||!_ch[idx].url)return;
_curIdx=idx;var ch=_ch[idx];
$('#vidTitle').textContent=ch.name;
$('#vidOv').classList.add('on');document.body.style.overflow='hidden';
var v=$('#video');if(_hls){_hls.destroy();_hls=null}
var url=ch.url;
if(url.indexOf('.m3u8')>=0){
if(Hls.isSupported()){_hls=new Hls();_hls.loadSource(url);_hls.attachMedia(v);_hls.on(Hls.Events.MANIFEST_PARSED,function(){v.play().catch(function(){})});$('#ppBtn').innerHTML='<i class="fas fa-pause"></i>'}
else if(v.canPlayType('application/vnd.apple.mpegurl')){v.src=url;v.play().catch(function(){ })}
}else{v.src=url;v.play().catch(function(){ })}
$('#ppBtn').innerHTML='<i class="fas fa-pause"></i>';
updateFavBtn();
v.ontimeupdate=function(){if(v.duration&&isFinite(v.duration)){$('#progFill').style.width=v.currentTime/v.duration*100+'%';$('#vTime').textContent=fT(v.currentTime)+' / '+fT(v.duration)}else{$('#vTime').textContent='LIVE';$('#progFill').style.width='0'}};
v.onplay=function(){$('#ppBtn').innerHTML='<i class="fas fa-pause"></i>'};
v.onpause=function(){$('#ppBtn').innerHTML='<i class="fas fa-play"></i>'};
}

function closeVid(){$('#vidOv').classList.remove('on');document.body.style.overflow='';var v=$('#video');v.pause();v.removeAttribute('src');if(_hls){_hls.destroy();_hls=null}_curIdx=-1}
function togglePlay(){var v=$('#video');v.paused?v.play():v.pause()}
function fT(s){var m=Math.floor(s/60),sec=Math.floor(s%60);return m+':'+(sec<10?'0':'')+sec}

function openAud(idx){
if(idx<0||idx>=_ch.length||!_ch[idx].url)return;
_curIdx=idx;var a=$('#audEl');if(_audioCtx){_audioCtx.close();_audioCtx=null}
var url=_ch[idx].url;
if(url.indexOf('.m3u8')>=0){if(Hls.isSupported()){var ah=new Hls();ah.loadSource(url);ah.attachMedia(a);ah.on(Hls.Events.MANIFEST_PARSED,function(){a.play().catch(function(){})});window._ah=ah}else{a.src=url;a.play().catch(function(){})}}
else{a.src=url;a.play().catch(function(){})}
$('#audName').textContent=_ch[idx].name;$('#audBar').classList.add('on');$('#audPlay').innerHTML='<i class="fas fa-pause"></i>';setupEq();render();
}
function toggleAud(){var a=$('#audEl');a.paused?a.play():a.pause();$('#audPlay').innerHTML=a.paused?'<i class="fas fa-play"></i>':'<i class="fas fa-pause"></i>'}
function closeAud(){var a=$('#audEl');a.pause();a.removeAttribute('src');if(window._ah){window._ah.destroy();window._ah=null}if(_audioCtx){_audioCtx.close();_audioCtx=null}cancelAnimationFrame(_animF);$('#audBar').classList.remove('on');_curIdx=-1;render()}
function setupEq(){try{_audioCtx=new(window.AudioContext||window.webkitAudioContext)();var an=_audioCtx.createAnalyser();an.fftSize=64;var src=_audioCtx.createMediaElementSource($('#audEl'));src.connect(an);an.connect(_audioCtx.destination);var bars=$$('#audEq i'),d=new Uint8Array(an.frequencyBinCount);function animate(){an.getByteFrequencyData(d);for(var i=0;i<bars.length;i++)bars[i].style.height=Math.max(3,d[i*2]/255*22)+'px';_animF=requestAnimationFrame(animate)}animate()}catch(e){}}

// ===== FAVORITES =====
function loadFav(){try{_favIdx=JSON.parse(localStorage.getItem('stv_fav')||'[]')}catch(e){_favIdx=[]}}
function saveFav(){localStorage.setItem('stv_fav',JSON.stringify(_favIdx));render()}
function toggleFav(idx){var i=_favIdx.indexOf(idx);if(i>=0){_favIdx.splice(i,1);toast('🗑 Удалено из избранного')}else{_favIdx.push(idx);toast('⭐ Добавлено в избранное')}saveFav()}
function updateFavBtn(){if(_curIdx<0)return;var arr=_ch[_curIdx].t==='r'?_radIdx:_tvIdx;$('#favBtn').innerHTML='<i class="'+(_favIdx.indexOf(_curIdx)>=0?'fas':'far')+' fa-star" style="color:'+(_favIdx.indexOf(_curIdx)>=0?'#ffd600':'')+'"></i>'}

// ===== TABS =====
function setTab(t){
_tab=t;_cat='all';
$$('.tab').forEach(function(el){el.classList.toggle('on',el.dataset.t===t)});
$$('.nav-item').forEach(function(el){el.classList.toggle('on',el.dataset.tab===t)});
$$('.sidebar-item').forEach(function(el){el.classList.toggle('on',el.dataset.tab===t)});
if(window.innerWidth>=768){$('#sidebar').classList.add('on')}
renderCats();render();
}

// ===== EVENTS =====
function setupEvents(){
$$('.tab').forEach(function(el){el.addEventListener('click',function(){setTab(el.dataset.t)})});
$$('.nav-item').forEach(function(el){el.addEventListener('click',function(){setTab(el.dataset.tab)})});
$$('.sidebar-item').forEach(function(el){el.addEventListener('click',function(){setTab(el.dataset.tab)})});
$('#searchIn').addEventListener('input',function(e){_q=e.target.value.trim();$('#searchX').classList.toggle('on',_q.length>0);render()});
$('#searchX').addEventListener('click',function(){$('#searchIn').value='';_q='';$('#searchX').classList.remove('on');render()});
$('#randBtn').addEventListener('click',randomCh);
$('#refBtn').addEventListener('click',refreshScan);
$('#refreshBtn').addEventListener('click',refreshScan);
$('#clearCacheBtn').addEventListener('click',clearCache);
$('#shareBtn').addEventListener('click',shareApp);
// Theme & Grid
$('#themeSel').addEventListener('change',function(){_theme=this.value;localStorage.setItem('stv_theme',_theme);applyTheme()});
$('#gridSel').addEventListener('change',function(){_gridCols=parseInt(this.value);localStorage.setItem('stv_grid',_gridCols);applyGrid()});
// Player
$('#vidClose').addEventListener('click',closeVid);
$('#vidOv').addEventListener('click',function(e){if(e.target===this)closeVid()});
$('#ppBtn').addEventListener('click',togglePlay);
$('#volRange').addEventListener('input',function(){$('#video').volume=parseFloat(this.value)});
$('#favBtn').addEventListener('click',function(){if(_curIdx>=0)toggleFav(_curIdx);updateFavBtn()});
$('#pipBtn').addEventListener('click',function(){var v=$('#video');if(document.pictureInPictureElement)document.exitPictureInPicture().catch(function(){});else if(v.requestPictureInPicture)v.requestPictureInPicture().catch(function(){})});
$('#fsBtn').addEventListener('click',function(){var w=$('.vid-screen');if(document.fullscreenElement)document.exitFullscreen();else if(w.requestFullscreen)w.requestFullscreen()});
$('#progWrap').addEventListener('click',function(e){var v=$('#video');if(!v.duration||!isFinite(v.duration))return;var r=this.getBoundingClientRect();v.currentTime=(e.clientX-r.left)/r.width*v.duration});
$('#audPlay').addEventListener('click',toggleAud);
$('#audClose').addEventListener('click',closeAud);
$('#toTop').addEventListener('click',function(){scrollTo({top:0,behavior:'smooth'})});
addEventListener('scroll',function(){$('#toTop').classList.toggle('on',scrollY>350)});
addEventListener('keydown',function(e){if(e.key==='Escape')closeVid()});
addEventListener('resize',function(){if(window.innerWidth>=768){$('#sidebar').classList.add('on');$('#bottomNav').classList.remove('on')}else{$('#sidebar').classList.remove('on');$('#bottomNav').classList.add('on')}});
document.addEventListener('click',function(e){
var t=e.target,pb=t.closest('[data-p]');if(pb){e.stopPropagation();var i=parseInt(pb.getAttribute('data-p'));_tab==='radio'?openAud(i):openVid(i);return}
var fb=t.closest('[data-f]');if(fb){e.stopPropagation();toggleFav(parseInt(fb.getAttribute('data-f')));return}
var cd=t.closest('.card[data-i]');if(cd){var ci=parseInt(cd.getAttribute('data-i'));_tab==='radio'?openAud(ci):openVid(ci);return}
});
$('#catsW').addEventListener('click',function(e){var btn=e.target.closest('[data-c]');if(btn){_cat=btn.dataset.c;renderCats();render()}});
}

// ===== UTILS =====
function toast(m){var d=document.createElement('div');d.className='toast';d.textContent=m;$('#toastC').appendChild(d);requestAnimationFrame(function(){d.classList.add('on')});setTimeout(function(){d.classList.remove('on');setTimeout(function(){d.remove()},400)},3000)}
function randomCh(){var idxs=_tab==='radio'?_radIdx:_tvIdx;if(!idxs.length){toast('Нет каналов');return}var r=idxs[Math.floor(Math.random()*idxs.length)];_tab==='radio'?openAud(r):openVid(r);toast('🎲 '+_ch[r].name)}
function shareApp(){if(navigator.share)navigator.share({title:'S TV — ТВ и Радио',url:location.href});else navigator.clipboard.writeText(location.href).then(function(){toast('✅ Ссылка скопирована!')})}

})();
</script>
