<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a0a14">
<meta name="description" content="S TV — Бесплатное ТВ и Радио online">
<meta property="og:title" content="S TV — ТВ и Радио">
<meta property="og:description" content="Бесплатное ТВ и Радио online от Safarali Group">
<title>S TV — ТВ и Радио</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230a0a14'/><text x='50' y='72' text-anchor='middle' font-size='60' font-weight='bold' fill='%2300d4ff'>S</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a14;--bg2:#0f0f1a;--card:rgba(255,255,255,0.03);--border:rgba(255,255,255,0.06);--accent:#00d4ff;--radio:#ff5e94;--hd:#00e676;--sd:#ffd600;--fhd:#00e5ff;--text:#fff;--text2:#989899;--text3:#5a5a6e;--r:16px}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:3px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit;border:none;outline:none}
a{text-decoration:none;color:inherit}

/* ========= SPLASH ========= */
#splash{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .6s}
#splash.out{opacity:0;pointer-events:none}
#splashCanvas{position:absolute;inset:0;width:100%;height:100%}
.splash-body{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:12px}
.splash-logo{font-size:72px;font-weight:700;color:var(--accent);text-shadow:0 0 40px rgba(0,212,255,0.5),0 0 80px rgba(0,212,255,0.2);animation:logoPop .8s cubic-bezier(.34,1.56,.64,1) forwards;transform:scale(0)}
@keyframes logoPop{to{transform:scale(1)}}
.splash-title{font-size:44px;font-weight:700;letter-spacing:2px}
.splash-title .t-s{color:var(--accent)}
.splash-title .t-tv{color:var(--text)}
.splash-slogan{font-size:15px;color:var(--text2);font-weight:300;min-height:22px}
.splash-slogan .cur{display:inline-block;width:2px;height:16px;background:var(--accent);vertical-align:text-bottom;animation:blink .6s step-end infinite}
@keyframes blink{50%{opacity:0}}
.splash-dev{position:absolute;bottom:50px;font-size:12px;color:var(--text3);opacity:0;animation:fadeIn .5s .5s forwards}
@keyframes fadeIn{to{opacity:1}}
.splash-bar{position:absolute;bottom:30px;width:180px;height:2px;background:rgba(255,255,255,0.05);border-radius:1px;overflow:hidden}
.splash-fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),#7B2FFF);transition:width .1s linear}

/* ========= HEADER ========= */
.header{position:sticky;top:0;z-index:100;background:rgba(10,10,20,0.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:10px}
.h-logo{font-size:20px;font-weight:700;color:var(--accent);white-space:nowrap}
.h-search{flex:1;max-width:360px;position:relative}
.h-search input{width:100%;padding:9px 34px 9px 36px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;color:#fff;font-size:13px;transition:border .3s}
.h-search input:focus{border-color:var(--accent)}
.h-search input::placeholder{color:var(--text3)}
.h-search i{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:13px}
.h-x{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;display:none;align-items:center;justify-content:center;color:var(--text3);font-size:11px}
.h-x.on{display:flex}
.h-x:hover{background:rgba(255,255,255,0.08)}
.h-stats{font-size:11px;color:var(--text3);white-space:nowrap}
.h-stats b{color:var(--accent)}
.h-btn{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:15px;transition:.3s}
.h-btn:hover{background:rgba(255,255,255,0.06);color:var(--accent)}
.h-btn.spin i{animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ========= TABS ========= */
.tabs{display:flex;padding:12px 16px 0;gap:4px}
.tab{flex:1;padding:10px;border-radius:12px;font-size:13px;font-weight:600;text-align:center;background:var(--card);border:1px solid var(--border);transition:.3s}
.tab:hover{border-color:rgba(0,212,255,0.3)}
.tab.on{background:var(--accent);color:#000;border-color:var(--accent)}
.tab.radio-tab.on{background:var(--radio);border-color:var(--radio)}

/* ========= SCAN ========= */
.scan-wrap{height:3px;background:var(--bg2);margin:0 16px;border-radius:2px;overflow:hidden;display:none}
.scan-wrap.on{display:block}
.scan-inner{height:100%;width:0;background:linear-gradient(90deg,var(--accent),#7B2FFF);transition:width .15s}
.scan-text{padding:6px 16px;font-size:11px;color:var(--text3);text-align:center;display:none}
.scan-text.on{display:block}

/* ========= CATEGORIES ========= */
.cats{display:flex;gap:6px;padding:10px 16px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.cats::-webkit-scrollbar{display:none}
.cat{padding:7px 14px;border-radius:18px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--card);border:1px solid var(--border);color:var(--text2);transition:.3s;flex-shrink:0}
.cat:hover,.cat.on{background:var(--accent);color:#000;border-color:var(--accent)}
.cat.radio-cat.on{background:var(--radio);border-color:var(--radio)}

/* ========= GRID ========= */
.main{padding:8px 16px 110px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}

/* ========= CARD ========= */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;transition:.35s cubic-bezier(.34,1.56,.64,1);cursor:pointer}
.card:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 8px 30px rgba(0,212,255,0.12)}
.card-th{aspect-ratio:16/9;background:var(--bg2);position:relative;overflow:hidden}
.card-th::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.04),transparent);animation:shim 2s infinite}
@keyframes shim{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.card-q{position:absolute;top:6px;left:6px;padding:2px 7px;border-radius:6px;font-size:9px;font-weight:700;text-transform:uppercase}
.card-q.hd{background:rgba(0,230,118,0.15);color:var(--hd)}
.card-q.sd{background:rgba(255,214,0,0.15);color:var(--sd)}
.card-q.fhd{background:rgba(0,229,255,0.15);color:var(--fhd)}
.card-star{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text3);opacity:0;transition:.3s}
.card:hover .card-star{opacity:1}
.card-star.on{color:#ffd600;opacity:1}
.card-body{padding:10px 12px}
.card-name{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:6px}
.card-name mark{background:rgba(0,212,255,0.25);color:#fff;border-radius:2px;padding:0 2px}
.card-btn{width:100%;padding:7px;border-radius:8px;font-size:11px;font-weight:600;background:rgba(0,212,255,0.1);color:var(--accent);transition:.3s}
.card-btn:hover{background:var(--accent);color:#000}
.card.radio-c{border-color:rgba(255,94,148,0.12)}
.card.radio-c:hover{border-color:var(--radio);box-shadow:0 8px 30px rgba(255,94,148,0.12)}
.card.radio-c .card-th{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(255,94,148,0.08),rgba(123,47,255,0.08))}
.card.radio-c .card-btn{background:rgba(255,94,148,0.1);color:var(--radio)}
.card.radio-c .card-btn:hover{background:var(--radio);color:#fff}
.eq{display:flex;gap:3px;align-items:flex-end;height:28px}
.eq i{display:block;width:3px;border-radius:2px;background:var(--radio);transition:height .15s}
.eq i:nth-child(1){height:6px;animation:eq .7s ease-in-out infinite alternate}
.eq i:nth-child(2){height:14px;animation:eq .7s .1s ease-in-out infinite alternate}
.eq i:nth-child(3){height:10px;animation:eq .7s .2s ease-in-out infinite alternate}
.eq i:nth-child(4){height:18px;animation:eq .7s .05s ease-in-out infinite alternate}
.eq i:nth-child(5){height:8px;animation:eq .7s .15s ease-in-out infinite alternate}
@keyframes eq{to{height:4px}}
.card.radio-c:not(.playing) .eq i{animation-play-state:paused;height:4px}
.card.radio-c.playing .eq i{animation-play-state:running}
.card.radio-c:hover .eq i{animation-play-state:running}
.fav-sec{grid-column:1/-1;padding:12px 0 4px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}

/* ========= VIDEO MODAL ========= */
.vid-overlay{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,0.92);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:.4s;padding:16px}
.vid-overlay.on{opacity:1;pointer-events:auto}
.vid-box{width:100%;max-width:900px;background:var(--bg2);border-radius:20px;overflow:hidden;transform:scale(0.85);transition:transform .4s cubic-bezier(.34,1.56,.64,1);position:relative}
.vid-overlay.on .vid-box{transform:scale(1)}
.vid-name{position:absolute;top:12px;left:14px;font-size:13px;font-weight:600;color:#fff;background:rgba(0,0,0,0.55);padding:5px 12px;border-radius:8px;z-index:5;pointer-events:none}
.vid-x{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:5;color:#fff;font-size:14px;transition:.3s}
.vid-x:hover{background:var(--radio)}
.vid-wrap{position:relative;background:#000;aspect-ratio:16/9}
.vid-wrap video{width:100%;height:100%;display:block}
.vid-ctrl{position:absolute;bottom:0;left:0;right:0;padding:10px 14px;background:linear-gradient(transparent,rgba(0,0,0,0.85));display:flex;flex-direction:column;gap:6px;transition:opacity .3s}
.vid-ctrl.hide{opacity:0}
.vid-prog{width:100%;height:3px;background:rgba(255,255,255,0.12);border-radius:2px;cursor:pointer}
.vid-prog-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2,#0072ff));border-radius:2px;width:0;transition:width .1s}
.vid-btns{display:flex;align-items:center;gap:10px}
.vid-btn{color:#fff;font-size:16px;padding:3px;transition:.2s}
.vid-btn:hover{color:var(--accent)}
.vid-time{font-size:11px;color:rgba(255,255,255,0.6);margin-left:auto}

/* ========= AUDIO PLAYER ========= */
.aud-bar{position:fixed;bottom:0;left:0;right:0;z-index:90;background:rgba(10,10,20,0.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid rgba(255,94,148,0.15);padding:10px 14px;display:none;align-items:center;gap:10px}
.aud-bar.on{display:flex}
.aud-eq{display:flex;gap:2px;align-items:flex-end;height:22px;min-width:22px}
.aud-eq i{display:block;width:3px;border-radius:2px;background:var(--radio)}
.aud-info{flex:1;min-width:0}
.aud-info .aud-n{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aud-info .aud-s{font-size:10px;color:var(--radio)}
.aud-play{width:36px;height:36px;border-radius:50%;background:var(--radio);display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;transition:.2s}
.aud-play:hover{transform:scale(1.08)}
.aud-close{color:var(--text3);font-size:16px;padding:4px}

/* ========= ABOUT ========= */
.about{display:none;padding:20px 16px 110px}
.about.on{display:block}
.about-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:28px;text-align:center}
.about-logo{width:80px;height:80px;border-radius:20px;background:linear-gradient(135deg,var(--accent),#0072ff);display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:700;margin:0 auto 14px;color:#000}
.about h2{font-size:22px;margin-bottom:4px}
.about .ver{font-size:12px;color:var(--text3);margin-bottom:16px}
.about .dev{font-size:14px;color:var(--text2);margin-bottom:20px}
.about-links{display:flex;flex-direction:column;gap:8px}
.about-link{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;font-size:13px;transition:.3s;width:100%;text-align:left}
.about-link:hover{border-color:var(--accent);background:rgba(0,212,255,0.05)}
.about-link i{width:18px;text-align:center;color:var(--accent);font-size:15px}

/* ========= TOAST ========= */
.toast-c{position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:6px}
.toast{padding:10px 18px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;font-size:12px;color:#fff;transform:translateX(120%);transition:transform .4s cubic-bezier(.34,1.56,.64,1);box-shadow:0 6px 24px rgba(0,0,0,0.5)}
.toast.on{transform:translateX(0)}
.toast.ok{border-color:var(--hd)}
.toast.err{border-color:var(--radio)}

/* ========= SCROLL TOP ========= */
.to-top{position:fixed;bottom:70px;right:14px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#000;display:none;align-items:center;justify-content:center;font-size:16px;z-index:50;box-shadow:0 4px 16px rgba(0,212,255,0.3)}
.to-top.on{display:flex}

/* ========= EMPTY ========= */
.empty{text-align:center;padding:50px 16px;color:var(--text3)}
.empty i{font-size:40px;margin-bottom:12px;opacity:.3}
.empty p{font-size:13px}

/* ========= RESPONSIVE ========= */
@media(min-width:500px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:768px){
.grid{grid-template-columns:repeat(4,1fr);gap:12px}
.tabs{padding:16px 24px 0}
.main,.about{padding-left:24px;padding-right:24px}
_cats{padding:10px 24px}
.header{padding:10px 24px}
}
@media(min-width:1024px){.grid{grid-template-columns:repeat(5,1fr)}}
@media(min-width:1440px){.grid{grid-template-columns:repeat(6,1fr);max-width:1500px;margin:0 auto}}
</style>
</head>

<script>
'use strict';
const API=['https://api.mediabay.tv/v2/channels/thread/','https://api.v1.mediabay.tv/v2/channels/thread/','https://api.v1.mediabay.uz/v2/channels/thread/'];
const MAX=850,BATCH=30;
let all=[],tv=[],rad=[],tab='tv',cat='all',fav=[],cur=null,scanning=false,q='';
let hls=null,audioCtx=null,animF=null;

const $=s=>document.querySelector(s);
const $$=s=>document.querySelectorAll(s);

// ===== SPLASH =====
!function(){
const cv=$('#splashCanvas'),cx=cv.getContext('2d');
let stars=[],mx=0,my=0;
function rs(){cv.width=innerWidth;cv.height=innerHeight}
rs();addEventListener('resize',rs);
for(let i=0;i<180;i++)stars.push({x:Math.random()*cv.width,y:Math.random()*cv.height,r:Math.random()*1.4+.3,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25,a:Math.random()});
addEventListener('mousemove',e=>{mx=(e.clientX/cv.width-.5)*15;my=(e.clientY/cv.height-.5)*15});
function draw(){cx.clearRect(0,0,cv.width,cv.height);stars.forEach(s=>{s.x+=s.vx;s.y+=s.vy;if(s.x<0)s.x=cv.width;if(s.x>cv.width)s.x=0;if(s.y<0)s.y=cv.height;if(s.y>cv.height)s.y=0;cx.beginPath();cx.arc(s.x+mx*s.a,s.y+my*s.a,s.r,0,6.28);cx.fillStyle=`rgba(255,255,255,${.25+s.a*.5})`;cx.fill()});requestAnimationFrame(draw)}
draw();
const sl='ТВ и Радио — всегда под рукой',el=$('#slogan');let i=0;
function tc(){if(i<sl.length){el.innerHTML=sl.slice(0,i+1)+'<span class="cur"></span>';i++;setTimeout(tc,55)}else el.innerHTML=sl+'<span class="cur"></span>'}
setTimeout(tc,900);
let p=0;const fl=$('#sFill');
const iv=setInterval(()=>{p+=Math.random()*18+4;if(p>=100){p=100;clearInterval(iv);setTimeout(()=>{$('#splash').classList.add('out');setTimeout(()=>{$('#splash').remove();init()},600)},250)}fl.style.width=p+'%'},80);
}();

// ===== INIT =====
function init(){
loadFav();
setupSearch();
setupScroll();
addEventListener('keydown',e=>{if(e.key==='Escape'){closeVid()}});
const cached=localStorage.getItem('stv_cache');
const ct=parseInt(localStorage.getItem('stv_ct')||'0');
if(cached&&Date.now()-ct<864e5){all=JSON.parse(cached);split();render();renderCats()}
else doScan();
}

// ===== CHANNELS =====
function split(){tv=all.filter(c=>c.t==='tv');rad=all.filter(c=>c.t==='r');$('#cntTv').textContent=tv.length;$('#cntR').textContent=rad.length;const a=$('#aTv');if(a){a.textContent=tv.length;$('#aR').textContent=rad.length}}
function detType(n){const l=n.toLowerCase();const rk=['radio','fm','музыка','хит','джаз','рок','ретро','волна','эхо','muz','шансон','эстрад','dance','house','techno','beat','mix','vip','gold','hit','music','news radio','biznes','comedy','love','relax','soft','deep'];return rk.some(k=>l.includes(k))?'r':'tv'}
function detQ(n){const l=n.toLowerCase();if(l.includes('full hd')||l.includes('fullhd')||l.includes('fhd')||l.includes('1080'))return'fhd';if(l.includes(' hd')||l.includes('hd '))return'hd';if(l.includes(' sd')||l.includes('sd ')||l.includes('low'))return'sd';return''}

const TV_CATS=['all','cinema','sport','news','kids','music','hd','region','other'];
const TV_LABELS=['🔥 Все','🎬 Кино','⚽ Спорт','📰 Новости','👶 Дети','🎵 Музыка','✨ HD','🌍 Регион','🎭 Разное'];
const R_CATS=['all','hits','rock','jazz','talk','dance','region'];
const R_LABELS=['🔥 Все','🎤 Хиты','🎸 Рок','🎷 Джаз','📡 Разговорное','💃 Танцевальное','🌐 Регион'];

function matchC(ch,c){
if(c==='all')return true;
const n=ch.name.toLowerCase();
switch(c){
case'cinema':return['кино','фильм','movie','film','cinema','box','prime','hbo','сериал','series'].some(k=>n.includes(k));
case'sport':return['спорт','sport','football','футбол','match','arena','espn','bein'].some(k=>n.includes(k));
case'news':return['news','новости','cnn','bbc','rt','fox','sky','blast','закон','ахбор'].some(k=>n.includes(k));
case'kids':return['дети','kid','child','cartoon','мульт','baby','nick','disney','boomerang'].some(k=>n.includes(k));
case'music':return['музыка','music','mtv','vh1','vevo','band','concert'].some(k=>n.includes(k));
case'hd':return ch.q==='hd'||ch.q==='fhd';
case'region':return['region','область','район','viloyat','tuman','town','city','local'].some(k=>n.includes(k));
case'other':return true;
case'hits':return['hit','хит','top','популярн','billboard','chart'].some(k=>n.includes(k));
case'rock':return['rock','рок','metal','punk','alternative','indie'].some(k=>n.includes(k));
case'jazz':return['jazz','джаз','blues','блюз','soul'].some(k=>n.includes(k));
case'talk':return['talk','разговор','news radio','интервью','comedy','stand'].some(k=>n.includes(k));
case'dance':return['dance','дэнс','techno','house','edm','club','vip'].some(k=>n.includes(k));
default:return true}}

function renderCats(){
const cs=tab==='radio'?R_CATS:TV_CATS;
const ls=tab==='radio'?R_LABELS:TV_LABELS;
$('#catsWrap').innerHTML=cs.map((c,i)=>`<button class="cat${tab==='radio'?' radio-cat':''}${c===cat?' on':''}" onclick="setCat('${c}')">${ls[i]}</button>`).join('');
}
function setCat(c){cat=c;renderCats();render()}

function render(){
const g=$('#grid'),em=$('#empty');
if(tab==='about'){$('#mainWrap').style.display='none';$('#aboutWrap').classList.add('on');$('#catsWrap').style.display='none';return}
$('#mainWrap').style.display='';$('#aboutWrap').classList.remove('on');$('#catsWrap').style.display='';

if(tab==='fav'){
const ft=all.filter(c=>fav.includes(c.id));
if(!ft.length){g.innerHTML='';em.style.display='';em.querySelector('p').textContent='Нет избранных каналов';return}
em.style.display='none';g.innerHTML=ft.map(c=>c.t==='r'?cardR(c):cardTV(c)).join('');return}

let chs=tab==='radio'?rad:tv;
if(q){const lq=q.toLowerCase();chs=chs.filter(c=>c.name.toLowerCase().includes(lq))}
chs=chs.filter(c=>matchC(c,cat));
if(!chs.length){g.innerHTML='';em.style.display='';em.querySelector('p').textContent='Каналы не найдены';return}
em.style.display='none';
g.innerHTML=chs.map(c=>c.t==='r'?cardR(c):cardTV(c)).join('');
}

function hl(t){if(!q)return t;return t.replace(new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`,'gi'),'<mark>$1</mark>')}
function cardTV(c){
const f=fav.includes(c.id);
const qc=c.q?`<span class="card-q ${c.q}">${c.q.toUpperCase()}</span>`:'';
return`<div class="card" onclick='playV(${JSON.stringify(c).replace(/'/g,"&#39;")})'><div class="card-th">${qc}<span class="card-star${f?' on':''}" onclick="event.stopPropagation();toggleFav('${c.id}')"><i class="${f?'fas':'far'} fa-star"></i></span></div><div class="card-body"><div class="card-name">${hl(c.name)}</div><button class="card-btn" onclick="event.stopPropagation();playV(${JSON.stringify(c).replace(/'/g,"&#39;")})">▶ Смотреть</button></div></div>`;
}
function cardR(c){
const f=fav.includes(c.id);
const playing=cur&&cur.id===c.id;
return`<div class="card radio-c${playing?' playing':''}" onclick='playR(${JSON.stringify(c).replace(/'/g,"&#39;")})'><div class="card-th"><div class="eq"><i></i><i></i><i></i><i></i><i></i></div><span class="card-star${f?' on':''}" onclick="event.stopPropagation();toggleFav('${c.id}')"><i class="${f?'fas':'far'} fa-star"></i></span></div><div class="card-body"><div class="card-name">${hl(c.name)}</div><button class="card-btn" onclick="event.stopPropagation();playR(${JSON.stringify(c).replace(/'/g,"&#39;")})">▶ Слушать</button></div></div>`;
}

// ===== SCANNER =====
async function doScan(){
if(scanning)return;scanning=true;
const sw=$('#scanWrap'),si=$('#scanIn'),st=$('#scanTxt'),rb=$('#refBtn');
sw.classList.add('on');st.classList.add('on');rb.classList.add('spin');
all=[];let found=0,th=0;
for(let i=0;i<MAX;i+=BATCH){
const batch=[];for(let j=i;j<Math.min(i+BATCH,MAX);j++)batch.push(j);
const res=await Promise.allSettled(batch.map(t=>fetchCh(t)));
res.forEach((r,idx)=>{th++;si.style.width=Math.round(th/MAX*100)+'%';st.textContent=`Сканирование: ${th}/${MAX} | Найдено: ${found}`;
if(r.status==='fulfilled'&&r.value){all.push(r.value);found++;$('#cntTv').textContent=all.filter(c=>c.t==='tv').length;$('#cntR').textContent=all.filter(c=>c.t==='r').length}});
}
split();render();
localStorage.setItem('stv_cache',JSON.stringify(all));
localStorage.setItem('stv_ct',Date.now().toString());
sw.classList.remove('on');st.classList.remove('on');rb.classList.remove('spin');
st.textContent=`Готово! ТВ: ${tv.length} | Радио: ${rad.length}`;
scanning=false;
}

async function fetchCh(id){
for(const m of API){
try{const ac=new AbortController();const t=setTimeout(()=>ac.abort(),8000);
const r=await fetch(m+id,{signal:ac.signal});clearTimeout(t);
if(!r.ok)continue;const d=await r.json();
if(d&&d.url&&d.name)return{id:'c'+id,name:d.name,url:d.url,t:detType(d.name),q:detQ(d.name)};
if(d&&d.streams&&d.streams[0]&&d.streams[0].url){const s=d.streams[0];return{id:'c'+id,name:d.name||s.name||('Ch '+id),url:s.url,t:detType(d.name||s.name||''),q:detQ(d.name||s.name||'')}}
}catch(e){continue}}return null}

function refreshScan(){localStorage.removeItem('stv_cache');localStorage.removeItem('stv_ct');doScan()}

// ===== VIDEO PLAYER =====
function playV(c){
cur=c;$('#vidName').textContent=c.name;$('#vidOv').classList.add('on');document.body.style.overflow='hidden';
const v=$('#video');if(hls){hls.destroy();hls=null}
if(c.url.includes('.m3u8')||c.url.includes('m3u8')){
if(Hls.isSupported()){hls=new Hls();hls.loadSource(c.url);hls.attachMedia(v);hls.on(Hls.Events.MANIFEST_PARSED,()=>v.play().catch(()=>{}))}
else if(v.canPlayType('application/vnd.apple.mpegurl')){v.src=c.url;v.play().catch(()=>{})}
}else{v.src=c.url;v.play().catch(()=>{})}
v.onplay=()=>$('#ppBtn').innerHTML='<i class="fas fa-pause"></i>';
v.onpause=()=>$('#ppBtn').innerHTML='<i class="fas fa-play"></i>';
v.ontimeupdate=updProg;
updFavBtn();startCtrlTimer();
}
function closeVid(){$('#vidOv').classList.remove('on');document.body.style.overflow='';const v=$('#video');v.pause();v.removeAttribute('src');if(hls){hls.destroy();hls=null}}
function togglePlay(){const v=$('#video');v.paused?v.play():v.pause()}
function toggleMute(){const v=$('#video');v.muted=!v.muted;$('#volIco').className=v.muted?'fas fa-volume-mute':'fas fa-volume-up'}
function setVol(v){$('#video').volume=parseFloat(v)}
function updProg(){const v=$('#video');if(v.duration&&isFinite(v.duration)){$('#progFill').style.width=v.currentTime/v.duration*100+'%';$('#vTime').textContent=fT(v.currentTime)+' / '+fT(v.duration)}else{$('#vTime').textContent='LIVE';$('#progFill').style.width='0'}}
function fT(s){const m=Math.floor(s/60),sec=Math.floor(s%60);return m+':'+(sec<10?'0':'')+sec}
function seek(e){const v=$('#video');if(!v.duration||!isFinite(v.duration))return;const r=e.currentTarget.getBoundingClientRect();v.currentTime=(e.clientX-r.left)/r.width*v.duration}
function pip(){const v=$('#video');if(document.pictureInPictureElement)document.exitPictureInPicture().catch(()=>{});else if(v.requestPictureInPicture)v.requestPictureInPicture().catch(()=>{})}
function goFs(){const w=$('#vidWrap');if(document.fullscreenElement)document.exitFullscreen();else if(w.requestFullscreen)w.requestFullscreen()}
function startCtrlTimer(){clearTimeout(window._ct);$('#vidCtrl').classList.remove('hide');window._ct=setTimeout(()=>$('vidCtrl')?.classList.add('hide'),3000)}
document.addEventListener('mousemove',startCtrlTimer);
function copyUrl(){if(cur)navigator.clipboard.writeText(cur.url).then(()=>toast('✅ Ссылка скопирована!','ok')).catch(()=>{})}

// ===== AUDIO =====
function playR(c){
cur=c;const a=$('#audEl');
if(audioCtx){audioCtx.close();audioCtx=null}
if(c.url.includes('.m3u8')||c.url.includes('m3u8')){
if(Hls.isSupported()){const ah=new Hls();ah.loadSource(c.url);ah.attachMedia(a);ah.on(Hls.Events.MANIFEST_PARSED,()=>a.play().catch(()=>{}));window._ah=ah}
else{a.src=c.url;a.play().catch(()=>{})}
}else{a.src=c.url;a.play().catch(()=>{})}
$('#audName').textContent=c.name;$('#audBar').classList.add('on');$('#audPlay').innerHTML='<i class="fas fa-pause"></i>';
setupEq();render();
}
function toggleAud(){const a=$('#audEl');a.paused?a.play():a.pause();$('#audPlay').innerHTML=a.paused?'<i class="fas fa-play"></i>':'<i class="fas fa-pause"></i>'}
function closeAud(){const a=$('#audEl');a.pause();a.removeAttribute('src');if(window._ah){window._ah.destroy();window._ah=null}if(audioCtx){audioCtx.close();audioCtx=null}cancelAnimationFrame(animF);$('#audBar').classList.remove('on');cur=null;render()}
function setupEq(){
try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();analyser=audioCtx.createAnalyser();analyser.fftSize=64;
const src=audioCtx.createMediaElementSource($('#audEl'));src.connect(analyser);analyser.connect(audioCtx.destination);
const bars=$$('#audEq i');const d=new Uint8Array(analyser.frequencyBinCount);
function an(){analyser.getByteFrequencyData(d);bars.forEach((b,i)=>{b.style.height=Math.max(3,d[i*2]/255*22)+'px'});animF=requestAnimationFrame(an)}an();
}catch(e){}}

// ===== FAVORITES =====
function loadFav(){try{fav=JSON.parse(localStorage.getItem('stv_fav')||'[]')}catch(e){fav=[]}}
function saveFav(){localStorage.setItem('stv_fav',JSON.stringify(fav));render()}
function toggleFav(id){const i=fav.indexOf(id);if(i>=0){fav.splice(i,1);toast('Удалено из избранного')}else{fav.push(id);toast('⭐ Добавлено в избранное','ok')}saveFav()}
function toggleFavCur(){if(cur)toggleFav(cur.id);updFavBtn()}
function updFavBtn(){if(!cur)return;$('#favBtn').innerHTML=`<i class="${fav.includes(cur.id)?'fas':'far'} fa-star" style="color:${fav.includes(cur.id)?'#ffd600':''}"></i>`}

// ===== SEARCH =====
function setupSearch(){$('#searchIn').addEventListener('input',e=>{q=e.target.value.trim();$('#searchX').classList.toggle('on',q.length>0);render()})}
function clearSearch(){$('#searchIn').value='';q='';$('#searchX').classList.remove('on');render()}

// ===== TABS =====
function setTab(t){tab=t;cat='all';
$$('.tab').forEach((b,i)=>{b.classList.toggle('on',(t==='tv'&&i===0)||(t==='radio'&&i===1)||(t==='about'&&i===2))});
if(t==='about'){$('#mainWrap').style.display='none';$('#aboutWrap').classList.add('on');$('#catsWrap').style.display='none';$('#refBtn').style.display='none'}
else{$('#mainWrap').style.display='';$('#aboutWrap').classList.remove('on');$('#catsWrap').style.display='';$('#refBtn').style.display=''}
renderCats();render()}

// ===== UTILS =====
function toast(m,t=''){const d=document.createElement('div');d.className='toast '+t;d.textContent=m;$('#toastC').appendChild(d);requestAnimationFrame(()=>d.classList.add('on'));setTimeout(()=>{d.classList.remove('on');setTimeout(()=>d.remove(),400)},3000)}
function setupScroll(){addEventListener('scroll',()=>$('toTop')?.classList.toggle('on',scrollY>350))}
function randomCh(){const cs=tab==='radio'?rad:tv;if(!cs.length){toast('Нет каналов');return}const c=cs[Math.floor(Math.random()*cs.length)];tab==='radio'?playR(c):playV(c);toast('🎲 '+c.name)}
function shareApp(){if(navigator.share)navigator.share({title:'S TV — ТВ и Радио',url:location.href});else navigator.clipboard.writeText(location.href).then(()=>toast('✅ Ссылка скопирована!','ok'))}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
