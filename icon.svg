<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#001824"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0099ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="180" fill="url(#glow)"/>
  <g transform="translate(256 256)">
    <circle r="120" fill="none" stroke="url(#accent)" stroke-width="6" opacity="0.4"/>
    <circle r="90" fill="none" stroke="url(#accent)" stroke-width="4" opacity="0.6"/>
    <circle r="60" fill="url(#accent)" opacity="0.15"/>
    <text x="0" y="22" font-family="Inter, Arial, sans-serif" font-size="120" font-weight="900" fill="url(#accent)" text-anchor="middle">S</text>
    <text x="0" y="90" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="0.9">TV</text>
  </g>
  <circle cx="96" cy="96" r="3" fill="#00d4ff" opacity="0.8"/>
  <circle cx="416" cy="96" r="2" fill="#00d4ff" opacity="0.6"/>
  <circle cx="96" cy="416" r="2" fill="#00d4ff" opacity="0.6"/>
  <circle cx="416" cy="416" r="3" fill="#00d4ff" opacity="0.8"/>
</svg>
