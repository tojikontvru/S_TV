name: GitHub Pages

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install -g gh-pages-deploy

      - name: Deploy to GitHub Pages
        uses: super-magnetic/action-github-pages@v0.2.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          directory: .
